      // Inject webpack runtime for Module Federation compatibility
      window.__webpack_require__ = {
        cache: {},
        m: {},
        l: () => Promise.resolve(),
      };
      window.__webpack_init_sharing__ = (scope) => {
        if (!window.__webpack_share_scopes__) {
          window.__webpack_share_scopes__ = {};
        }
        if (!window.__webpack_share_scopes__[scope]) {
          window.__webpack_share_scopes__[scope] = {};
        }
        return Promise.resolve();
      };
      window.__webpack_share_scopes__ = { default: {} };
    </script>
